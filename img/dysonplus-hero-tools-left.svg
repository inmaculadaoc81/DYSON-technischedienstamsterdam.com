<defs>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DFDDE2"/></linearGradient>
 <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E4E6EA"/><stop offset="1" stop-color="#BFC3CB"/></linearGradient>
 <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B8BCC4"/><stop offset="1" stop-color="#868B96"/></linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4C5059"/><stop offset=".3" stop-color="#E1E3E7"/><stop offset=".42" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#A0A4AD"/><stop offset="1" stop-color="#3D4149"/></linearGradient>
 <linearGradient id="chromeH" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4C5059"/><stop offset=".3" stop-color="#E1E3E7"/><stop offset=".42" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#A0A4AD"/><stop offset="1" stop-color="#3D4149"/></linearGradient>
 <linearGradient id="cylBlue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4A0822"/><stop offset=".32" stop-color="#E03A7A"/><stop offset=".45" stop-color="#F59BBE"/><stop offset=".7" stop-color="#C2185B"/><stop offset="1" stop-color="#4A0822"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B8BCC4" stop-opacity=".75"/><stop offset=".35" stop-color="#F1F2F4" stop-opacity=".55"/><stop offset=".7" stop-color="#DCDEE3" stop-opacity=".45"/><stop offset="1" stop-color="#868B96" stop-opacity=".8"/></linearGradient>
 <linearGradient id="headTop" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E03A7A"/><stop offset="1" stop-color="#5E0B2C"/></linearGradient>
