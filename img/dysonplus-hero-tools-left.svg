 <linearGradient id="orangeV" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8E1043"/><stop offset=".4" stop-color="#FF8DB9"/><stop offset="1" stop-color="#B0164F"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1D1F24"/><stop offset=".4" stop-color="#4A4E57"/><stop offset="1" stop-color="#1D1F24"/></linearGradient>
 <radialGradient id="disc" cx=".38" cy=".32" r=".8"><stop stop-color="#EC6A9B"/><stop offset=".55" stop-color="#C2185B"/><stop offset="1" stop-color="#4A0822"/></radialGradient>
