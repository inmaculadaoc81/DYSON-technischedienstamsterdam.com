<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620">
<defs>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DFDDE2"/></linearGradient>
 <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E4E6EA"/><stop offset="1" stop-color="#BFC3CB"/></linearGradient>
 <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B8BCC4"/><stop offset="1" stop-color="#868B96"/></linearGradient>
 <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E8558C"/><stop offset=".5" stop-color="#C2185B"/><stop offset="1" stop-color="#5E0B2C"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1F1E24"/><stop offset="1" stop-color="#0D0D10"/></linearGradient>
 <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="gear" cx=".35" cy=".3" r=".85"><stop stop-color="#FFC2DA"/><stop offset=".45" stop-color="#FF6FA8"/><stop offset="1" stop-color="#B0164F"/></radialGradient>
 <radialGradient id="hole" cx=".6" cy=".65" r=".8"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#CED1D7"/></radialGradient>
 <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EE76A3"/><stop offset=".5" stop-color="#C2185B"/><stop offset="1" stop-color="#5E0B2C"/></linearGradient>
 <linearGradient id="bat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5A5E68"/><stop offset=".45" stop-color="#33373F"/><stop offset="1" stop-color="#1D1F24"/></linearGradient>
 <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EEEFF2"/><stop offset="1" stop-color="#868B96"/></linearGradient>
 <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC2DA"/><stop offset="1" stop-color="#D81B60"/></linearGradient>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#16161A" flood-opacity=".2"/></filter>
</defs>
<g transform="translate(55 80)" stroke-linejoin="round">
 <!-- base isométrica con volumen -->
 <g filter="url(#drop)">
  <path d="M20 390 155 315l145 82-140 80z" fill="url(#top)"/>
  <path d="M20 390v28l140 80v-21z" fill="url(#sideL)"/>
  <path d="M160 477v21l140-80v-21z" fill="url(#sideR)"/>
  <path d="M20 390 155 315l145 82" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity=".9"/>
 </g>
 <!-- sombras de contacto -->
 <ellipse cx="150" cy="380" rx="95" ry="18" fill="#16161A" opacity=".14" filter="url(#soft)"/>
 <ellipse cx="72" cy="392" rx="34" ry="8" fill="#16161A" opacity=".28" filter="url(#soft)"/>
 <ellipse cx="258" cy="412" rx="62" ry="10" fill="#16161A" opacity=".28" filter="url(#soft)" transform="rotate(12 258 412)"/>
 <!-- pantalla de diagnóstico con grosor -->
